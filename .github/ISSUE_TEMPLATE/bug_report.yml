name: Bug report
description: Something is not working as expected
labels: [bug, triage]
body:
  - type: input
    id: version
    attributes:
      label: Vitrine version
      placeholder: 4.6.2
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behavior.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
